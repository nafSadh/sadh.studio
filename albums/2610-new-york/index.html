<style>
/* Layout: one section per post; every tile has the same pixel area (3:4 portrait, 4:3 landscape), wrapping with page scroll only */
:root{--bg:#f3f2ef;--fg:#1d1f22;--muted:#6c6f73;--rule:#d9d7d1;--accent:#2f4a7a;--shade:rgba(14,15,17,.94);
--display:"Fraunces","Iowan Old Style",Georgia,serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--row:260px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141518;--fg:#e9e7e2;--muted:#9a9ca1;--rule:#2c2e33;--accent:#9db4dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141518;--fg:#e9e7e2;--muted:#9a9ca1;--rule:#2c2e33;--accent:#9db4dc;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;border-bottom:1px solid var(--rule);padding-bottom:20px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,68px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;flex-direction:column;gap:2px;text-align:right}
.meta a.back{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}.meta a.back:hover{border-bottom-color:var(--accent)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px 18px;padding:10px 0;margin-top:8px;background:var(--bg);border-bottom:1px solid var(--rule)}
.chnav{display:flex;gap:4px 18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0;flex:1}
.chnav::-webkit-scrollbar{display:none}
.chnav a{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.chnav a.on{color:var(--fg)}
.chnav a b{color:var(--accent);font-weight:500;margin-right:4px}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none}
.seg button{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--muted);border:0;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.chnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chap{display:flex;gap:18px;align-items:flex-start;margin-top:88px;padding-top:28px;border-top:1px solid var(--rule);scroll-margin-top:60px}
#sections>.chap:first-child{margin-top:28px;border-top:0;padding-top:0}
.chap .num{font-family:var(--display);font-size:clamp(48px,7vw,84px);line-height:.9;color:var(--accent);min-width:1.2em}
.chap h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.4vw,52px);margin:0;line-height:1.02;text-wrap:balance}
.chap .date{display:block;margin-top:6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chap p{margin:10px 0 0;color:var(--muted);max-width:62ch}
.rows{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.rows::after{content:"";flex-grow:999999}
figure{margin:0;position:relative;cursor:zoom-in;background:var(--rule);overflow:hidden;max-width:100%}
figure img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
figure:hover img{transform:scale(1.015)}
figure:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
figcaption{position:absolute;inset:auto 0 0 0;padding:22px 10px 8px;font-size:12.5px;line-height:1.35;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62));opacity:0;transition:opacity .2s}
figure:hover figcaption,figure:focus-visible figcaption{opacity:1}
figure .tags{position:absolute;left:6px;top:6px;display:flex;gap:4px;pointer-events:none}
figure .tags span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:3px}
footer{margin-top:56px;border-top:1px solid var(--rule);padding-top:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.lb{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.lb .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px 64px 8px;position:relative}
.lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.lb .tag{position:absolute;left:50%;top:calc(24px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:999px;pointer-events:none}
.lb .info{color:#e9e7e2;padding:6px 20px 18px;text-align:center;font-size:14px}
.lb .info .tech{font-family:var(--mono);font-size:11.5px;color:#a7a9ae;margin-top:3px;letter-spacing:.03em}
.lb .hint{font-family:var(--mono);font-size:11px;color:#8d9096;margin-top:4px}
.lb button{position:absolute;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb .prev{left:max(12px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .next{right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .close{right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
.lb .count{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(20px + env(safe-area-inset-top,0px));font-family:var(--mono);font-size:12px;color:#a7a9ae}
@media (max-width:640px){:root{--row:150px}.rows{gap:4px}.lb .stage{padding:56px 8px 8px}.lb .prev,.lb .next{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:none}.meta{text-align:left}}
@media (prefers-reduced-motion:reduce){figure img,figcaption{transition:none}figure:hover img{transform:none}}
</style>
<style>
[hidden]{display:none!important}
.post{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);scroll-margin-top:60px}
.post .hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.post .num{font-family:var(--display);font-size:clamp(38px,5vw,56px);line-height:.9;color:var(--accent);min-width:1.4em}
.post h3{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,34px);letter-spacing:-.02em;margin:0;line-height:1.08}
.post .meta2{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.post .cap{margin:8px 0 0;color:var(--muted);max-width:62ch;font-style:italic}

:root{--rh:300px}@media (max-width:640px){:root{--rh:200px}}
</style>

const root = document.getElementById("sections"), nav = document.getElementById("chnav");
let lbList = [], lbI = 0, lbTitle = "";
function strip(frames, title, all){ all = all || frames;
  const s = document.createElement("div"); s.className = "strip";
  frames.forEach((f, i) => {
    const fig = document.createElement("figure"); fig.tabIndex = 0; if (f.w > f.h) fig.className = "l"; fig.dataset.r = (f.w / f.h).toFixed(4);
    fig.innerHTML = `<img src="https://img.sadh.studio/albums/2610-new-york/${IMG[f.id]}?v=${f.v||""}" alt="${f.id}" loading="lazy" decoding="async"><span class="n">${all.indexOf(f) + 1}</span><span class="pid">${f.id}</span>`;
    const go = () => { lbList = all; lbI = all.indexOf(f); lbTitle = title; show(); };
    fig.onclick = go; fig.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    s.appendChild(fig);
  });
  return s;
}
let n = 0;
D.posts.forEach(p => {
  n++;
  const el = document.createElement("section"); el.className = "post"; el.id = "p-" + p.id;
  el.innerHTML = `<div class="hd"><span class="num">${n}</span><div><h3>${p.t}</h3><span class="meta2">${p.f.length} frames</span></div></div>`;
  el.appendChild(strip(p.f, p.t)); root.appendChild(el);
  nav.insertAdjacentHTML("beforeend", `<a href="#p-${p.id}" data-k="p-${p.id}"><b>${n}</b> ${p.t.split(",")[0]}</a>`);
});
document.getElementById("cnt").textContent = D.posts.length + " sets · " + D.posts.reduce((a, p) => a + p.f.length, 0) + " frames";
function spy(){ let cur = ""; document.querySelectorAll(".post").forEach(h => { if (h.getBoundingClientRect().top < 140) cur = h.id; });
  nav.querySelectorAll("a").forEach(a => { const on = a.dataset.k === cur; a.classList.toggle("on", on); if (on) a.scrollIntoView({block:"nearest", inline:"nearest"}); }); }
let st; addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(spy, 80); }, {passive:true}); spy();
const lb = document.getElementById("lb"), img = document.getElementById("lbImg");
function show(){ const f = lbList[lbI]; img.src = `https://img.sadh.studio/albums/2610-new-york/${IMG[f.id]}?v=${f.v||""}`; document.getElementById("lbCount").textContent = `${lbI + 1} / ${lbList.length}`;
  document.getElementById("lbCap").textContent = `${f.id} · ${lbTitle}`; lb.hidden = false; }
function step(k){ lbI = (lbI + k + lbList.length) % lbList.length; show(); }
document.getElementById("lbClose").onclick = () => lb.hidden = true;
document.getElementById("lbPrev").onclick = () => step(-1); document.getElementById("lbNext").onclick = () => step(1);

addEventListener("keydown", e => { if (lb.hidden) return; if (e.key === "Escape") lb.hidden = true; if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });
let tx = null; img.addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
img.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

// equal-area tiles: a portrait (p x 4p/3) and a landscape (4p/3 x p) cover the same pixels.
// 4 portraits and 3 landscapes span the same width, so p is picked to make both kinds of row fill it.
function justify(){ const G = 8;
  document.querySelectorAll(".strip").forEach(s => { const W = s.clientWidth; if (!W) return;
    const k = W < 640 ? 0 : Math.max(1, Math.round((W + G) / (4 * (230 + G))));
    const p = k ? (W - (4 * k - 1) * G) / (4 * k) : (W - G) / 2, A = p * p * 4 / 3;
    const nat = r => Math.sqrt(A * r), rows = []; let row = [], used = 0;
    [...s.children].forEach(f => { const r = +f.dataset.r || 1;
      if (row.length && used + G + nat(r) > W + 1) { rows.push(row); row = []; used = 0; }
      used += (row.length ? G : 0) + nat(r); row.push([f, r]); });
    if (row.length) rows.push(row);
    rows.forEach((rw, i) => { const R = rw.reduce((a, x) => a + x[1], 0), hn = rw.reduce((a, x) => a + nat(x[1]), 0) / R;
      let h = (W - G * (rw.length - 1)) / R;
      h = Math.min(h, hn * (i === rows.length - 1 ? 1 : 1.35));
      rw.forEach(([f, r]) => { f.style.width = Math.floor(h * r) + "px"; f.style.height = Math.floor(h) + "px"; }); }); }); }
justify(); let jt; new ResizeObserver(() => { clearTimeout(jt); jt = setTimeout(justify, 60); }).observe(document.body);
