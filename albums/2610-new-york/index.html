<style>

:root[data-theme="dark"],:root:has(>head>meta[name="color-scheme"][content="dark"]){

  radial-gradient(ellipse 68% 55% at 86% 30% var(--in-oklab),color-mix(in oklab,var(--accent),transparent 86%),transparent 66%),
  radial-gradient(ellipse 78% 68% at 76% 88% var(--in-oklab),color-mix(in oklab,var(--bruple),transparent 88%),transparent 70%),
  radial-gradient(ellipse 62% 52% at 26% 72% var(--in-oklab),color-mix(in oklab,var(--link),transparent 88%),transparent 64%)}

  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::selection{background:color-mix(in oklab,var(--accent),transparent 72%);color:var(--fg)}

.wrap-head{padding-block:34px 12px}
.wrap-main{padding-block:0 64px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px 28px}

.kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin-bottom:12px}

.cbtn{appearance:none;font-family:var(--mono);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);background:color-mix(in oklab,var(--bg2) 60%,transparent);border:1px solid var(--rule);padding:7px 11px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:color .2s,border-color .2s,background .2s;text-decoration:none;line-height:1;display:inline-flex;align-items:center;justify-content:center}

.tbtn .t-light{display:none}.tbtn .t-dark{display:inline-flex}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not(:has(>head>meta[name="color-scheme"][content="light"])) .tbtn .t-dark{display:none}:root:not([data-theme="light"]):not(:has(>head>meta[name="color-scheme"][content="light"])) .tbtn .t-light{display:inline-flex}}
:root[data-theme="dark"] .tbtn .t-dark,:root:has(>head>meta[name="color-scheme"][content="dark"]) .tbtn .t-dark{display:none}
:root[data-theme="dark"] .tbtn .t-light,:root:has(>head>meta[name="color-scheme"][content="dark"]) .tbtn .t-light{display:inline-flex}

<style>
[hidden]{display:none!important}
.bar{position:sticky;top:env(safe-area-inset-top,0px);container-type:scroll-state;container-name:album-bar;z-index:8;width:100%}
.bar-surf{background:transparent;border-bottom:1px solid transparent;transition:background-color .2s ease,border-color .2s ease}
.bar.is-stuck .bar-surf{background:color-mix(in oklab,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:color-mix(in oklab,var(--rule),transparent 40%)}
@container album-bar scroll-state(stuck: top){.bar-surf{background:color-mix(in oklab,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:color-mix(in oklab,var(--rule),transparent 40%)}}
.bar-in{max-width:1500px;margin:0 auto;padding-left:calc(max(18px,env(safe-area-inset-left,0px)) + var(--rail-off));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:8px}
.chnav{scroll-target-group:auto;display:flex;gap:4px 16px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}
.chnav.is-over{mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 28px),transparent);padding-right:24px}
.chnav::-webkit-scrollbar{display:none}
.chnav a{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:2px 0;transition:color .2s}
.chnav a:hover{color:var(--fg)}
.chnav a:is(:target-current,.on){color:var(--fg);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:5px;text-decoration-thickness:1.5px}
.chnav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.post{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:10px var(--rail-gap);align-items:start;margin-top:36px;scroll-margin-top:calc(52px + env(safe-area-inset-top,0px))}
#sections>.post:first-child{margin-top:18px}
.post.one{display:block;margin-top:22px}
.post .hd{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));text-align:right;padding:1px 16px 2px 0;border-right:1.5px solid color-mix(in oklab,var(--accent) 45%,var(--rule))}
.post h2{font-family:var(--display);font-weight:400;font-size:16.5px;line-height:1.3;letter-spacing:-.01em;color:var(--fg);margin:0;text-wrap:balance}
.post .meta2{display:block;margin-top:3px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted)}
.post-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.strip{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
figure{margin:0;flex:none;position:relative;cursor:zoom-in;background:var(--bg2);border-radius:2px;box-shadow:0 0 0 1px color-mix(in oklab,var(--accent),transparent 88%),0 14px 34px -22px rgba(0,0,0,.45);overflow:hidden;max-width:100%;width:232px;height:309px;transition:box-shadow .25s ease}
figure.l{width:309px;height:232px}
figure:hover{box-shadow:0 0 0 1px color-mix(in oklab,var(--accent),transparent 48%),0 18px 40px -20px rgba(0,0,0,.6)}

/* still movements native modal lightbox */
dialog.lb{position:fixed;inset:0;width:100%;height:100dvh;max-width:none;max-height:none;margin:0;border:0;outline:0;overflow:hidden;box-sizing:border-box;color:var(--fg);background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

dialog.lb::backdrop{background:transparent;overflow:hidden;overscroll-behavior:contain}
.lb[open]{display:flex;align-items:stretch;touch-action:pinch-zoom;background:radial-gradient(680px circle at var(--throw-x) var(--throw-y) var(--in-oklab),color-mix(in oklab,var(--lbglow,var(--accent)),transparent 74%) 0%,color-mix(in oklab,var(--lbglow,var(--accent)),transparent 88%) 40%,transparent 70%),var(--bg);transition:background .18s ease}
.lb.lb-below{flex-direction:column}

.lb img{max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain;cursor:zoom-out;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 1px color-mix(in oklab,var(--fg),transparent 92%),0 0 90px -16px color-mix(in oklab,var(--lbglow,var(--accent)),transparent 52%),0 44px 120px color-mix(in oklab,var(--fg),transparent 78%)}
.lb .panel{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;z-index:4;cursor:auto}
.lb .panel::before{content:"";width:42px;height:1px;background:color-mix(in oklab,var(--lbglow,var(--accent)),#000 28%);align-self:center;margin-bottom:8px;flex:0 0 auto}
.lb.lb-side .panel{width:clamp(230px,23dvw,330px);justify-content:center;align-items:flex-start;text-align:left;padding:30px 34px}

.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.links:empty{display:none}
.lb.lb-side .links{justify-content:flex-start}
.lk{appearance:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--rule);padding:5px 9px;cursor:pointer;transition:color .2s,border-color .2s,background .2s;background:color-mix(in oklab,var(--bg2),transparent 35%)}
.lk:hover{color:var(--fg);border-color:var(--accent);background:color-mix(in oklab,var(--accent),transparent 88%)}
.lk:focus-visible,.lb .lbx:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lk .ico{width:11px;height:11px;flex:0 0 auto}
.lk.reddit .ico{color:var(--reddit)}.lk.ig .ico{color:#d6336c}.lk.sec{color:var(--bruple)}
.lb .lbnav{position:fixed;top:0;bottom:0;width:12%;cursor:pointer;border:0;background:transparent;z-index:2;outline:0}
.lb .lbprev{left:0}.lb .lbnext{right:0}
.lb .lbnav:focus-visible::after{content:"‹";position:absolute;top:50%;left:18px;transform:translateY(-50%);width:34px;height:34px;border-radius:999px;border:2px solid var(--accent);background:color-mix(in oklab,var(--bg2) 80%,transparent);color:var(--fg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px}

.lb .lbx{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px));font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);background:transparent;border:0;cursor:pointer;z-index:6;display:inline-flex;align-items:center;gap:6px;padding:4px}
.lb .lbx svg{width:11px;height:11px;display:block}

@media (max-width:820px){
  .bar-in{padding-left:max(18px,env(safe-area-inset-left,0px))}
  .post{grid-template-columns:1fr;gap:10px;margin-top:28px}
  .post .hd{position:static;text-align:left;border-right:0;border-left:2px solid color-mix(in oklab,var(--accent) 50%,var(--rule));padding:1px 0 2px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}

</style>

function splitFrames(frames){
  const L = [], P = [], S = [];
  frames.forEach(f => { const r = f.w / f.h; if (r > 1.03) L.push(f); else if (r < 0.97) P.push(f); else S.push(f); });

  const sqToL = wSum(L) <= wSum(P);
  const gL = frames.filter(f => { const r = f.w / f.h; return r > 1.03 || (sqToL && r >= 0.97); });
  const gP = frames.filter(f => { const r = f.w / f.h; return r < 0.97 || (!sqToL && r <= 1.03); });
  if (gL.length <= 1 || gP.length <= 1) return [frames];
  return gL.includes(frames[0]) ? [gL, gP] : [gP, gL];
}

      fig.innerHTML = `<img src="${u}" onerror="if(this.src!==this.dataset.r&&this.dataset.r)this.src=this.dataset.r" data-r="${ru}" alt="${escH(f.t || (p.t ? p.t + " — " + f.id : f.id))}" loading="lazy" decoding="async">`;
      fig.addEventListener("click", () => { openedByKey = false; show(gIdx); });
      fig.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); openedByKey = true; show(gIdx); } else if (e.key === " ") { e.preventDefault(); } });
      fig.addEventListener("keyup", e => { if (e.key === " ") { e.preventDefault(); openedByKey = true; show(gIdx); } });
      s.appendChild(fig);

    });
    body.appendChild(s);
  });
  el.appendChild(body);
  root.appendChild(el);
  if (!ONE) nav.insertAdjacentHTML("beforeend", `<a href="#p-${escH(p.id)}" data-k="p-${escH(p.id)}">${escH(p.s || p.t)}</a>`);
});

document.getElementById("cnt").textContent = (ONE ? "" : D.posts.length + " sets · ") + ALL.length + " frames";

// Scrollspy & sticky state
let curSec = D.posts[0] ? "p-" + D.posts[0].id : "";
function markSec(id){
  if (!id || ONE) return;
  curSec = id;
  nav.querySelectorAll("a").forEach(a => {
    const on = a.dataset.k === id;
    a.classList.toggle("on", on);
    if (on) { a.setAttribute("aria-current", "location"); a.scrollIntoView({block:"nearest", inline:"nearest"}); }
    else a.removeAttribute("aria-current");
  });
}
if (!ONE) {
  const posts = [...document.querySelectorAll(".post")];
  if (CSS.supports("scroll-target-group: auto")) {
    const syncAria = () => {
      const tc = nav.querySelector("a:target-current");
      if (tc) { curSec = tc.dataset.k; nav.querySelectorAll("a").forEach(a => a === tc ? a.setAttribute("aria-current", "location") : a.removeAttribute("aria-current")); tc.scrollIntoView({block:"nearest", inline:"nearest"}); }
    };
    addEventListener("scrollend", syncAria, {passive:true});
    addEventListener("hashchange", () => requestAnimationFrame(syncAria));
    syncAria();
  } else {
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) markSec(e.target.id); });
    }, {rootMargin: "-14% 0px -76% 0px"});
    posts.forEach(p => io.observe(p));
    markSec(curSec);
  }
  if (!CSS.supports("container-type: scroll-state")) {
    const barEl = document.querySelector(".bar"), topOff = parseFloat(getComputedStyle(barEl).top) || 0;
    new IntersectionObserver(([e]) => { barEl.classList.toggle("is-stuck", e.intersectionRatio < 1); }, {threshold:[1], rootMargin:`-${topOff + 1}px 0px 0px 0px`}).observe(barEl);
  }
}

// Dominant colour glow (same saliency-weighted hue histogram as still movements)
function domGlow(img){try{if(!img||!img.complete||!img.naturalWidth)return null;
  const N=28,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d");
  x.drawImage(img,0,0,N,N);const d=x.getImageData(0,0,N,N).data;
  const B=18,cw=new Array(B).fill(0),hh=new Array(B).fill(0),ss=new Array(B).fill(0),ll=new Array(B).fill(0),cn=new Array(B).fill(0);
  let totL=0,totS=0,pN=0;
  for(let k=0;k<d.length;k+=4){
    const R=d[k]/255,G=d[k+1]/255,Bb=d[k+2]/255,mx=Math.max(R,G,Bb),mn=Math.min(R,G,Bb),l=(mx+mn)/2;
    pN++;totL+=l;if(mx===mn)continue;
    const dd=mx-mn,s=l>.5?dd/(2-mx-mn):dd/(mx+mn);totS+=s;if(s<.16)continue;
    let h=mx===R?(G-Bb)/dd+(G<Bb?6:0):mx===G?(Bb-R)/dd+2:(R-G)/dd+4;h*=60;
    const w=s*Math.max(.3,1-Math.abs(l-.5)*1.25),bi=Math.floor(h/360*B)%B;
    cw[bi]+=w;hh[bi]+=w*h;ss[bi]+=w*s;ll[bi]+=w*l;cn[bi]++;
  }
  const avgL=pN?totL/pN:.5,avgS=pN?totS/pN:0,sm=new Array(B);
  for(let i=0;i<B;i++)sm[i]=cw[i]+.55*cw[(i+1)%B]+.55*cw[(i+B-1)%B];
  let best=-1,bv=0;for(let i=0;i<B;i++)if(sm[i]>bv){bv=sm[i];best=i;}
  let H=best>=0&&cw[best]>0?Math.round(((hh[best]/cw[best])%360+360)%360):216;
  if(H>=182&&H<=212)H=Math.round(H+(214-H)*.45);
  const clS=best>=0&&cw[best]>0?ss[best]/cw[best]:0,frac=best>=0?cn[best]/pN:0;
  const scale=Math.min(1,.45+avgS*3.5)*Math.min(1,.3+frac*6);
  const S=Math.round(Math.max(4,Math.min(68,clS*100*scale)));
  const L=Math.round(Math.max(44,Math.min(72,(best>=0&&cw[best]>0?ll[best]/cw[best]:avgL)*100)));
  return `hsl(${H},${S}%,${L}%)`;
}catch{return null;}}

// Lightbox (<dialog closedby="any"> + seamless cross-section navigation)
const lb = document.getElementById("lb"), stage = lb.querySelector(".stage"), lbi = document.getElementById("lbi"), lbtitle = document.getElementById("lbtitle"), lbmeta = document.getElementById("lbmeta"), lblinks = document.getElementById("lblinks");
const LOADED = new Set();
let idx = -1, curAr = 1, curHi = "";
function setHash(u){ try { history.replaceState(null, "", u); } catch {} }
function warm(u, cb){ if (!u) return; if (LOADED.has(u)) { cb && cb(); return; } const im = new Image(); im.onload = () => { LOADED.add(u); cb && cb(); }; im.src = u; }
function srcOf(f){ return `${BASE}${IMG[f.id]}?v=${f.v||""}`; }
function rsrcOf(f){ return `${RBASE}${IMG[f.id]}?v=${f.v||""}`; }
function sideLayout(ar){ return ar < innerWidth / innerHeight; }
function fitImg(){
  const cs = getComputedStyle(stage);
  const sw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const sh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if (sw <= 0 || sh <= 0) return;
  if (sw / sh > curAr) { lbi.style.height = sh + "px"; lbi.style.width = Math.round(sh * curAr) + "px"; }
  else { lbi.style.width = sw + "px"; lbi.style.height = Math.round(sw / curAr) + "px"; }
}

function show(i){
  if (i < 0 || i >= ALL.length) return;
  idx = i;
  const it = ALL[i], f = it.f, timg = it.fig.querySelector("img");
  curAr = f.w / f.h;
  const g = domGlow(timg);
  if (g) document.documentElement.style.setProperty("--lbglow", g);
  else document.documentElement.style.removeProperty("--lbglow");
  const baseSrc = srcOf(f), remSrc = rsrcOf(f);
  lbi.onerror = () => { if (lbi.src !== remSrc && RBASE) lbi.src = remSrc; };
  curHi = f.hi || "";
  if (curHi && LOADED.has(curHi)) lbi.src = curHi;
  else {
    lbi.src = baseSrc;
    if (curHi) warm(curHi, () => { if (idx === i && curHi === f.hi) lbi.src = curHi; });
  }
  setTimeout(() => {
    const n1 = ALL[(i + 1) % ALL.length].f, n2 = ALL[(i - 1 + ALL.length) % ALL.length].f;
    warm(n1.hi || srcOf(n1)); warm(n2.hi || srcOf(n2));
  }, 60);
  const hasCap = f.t && f.t !== it.pTitle;
  lbtitle.textContent = hasCap ? f.t : (ONE ? (document.querySelector("h1")?.textContent.trim() || it.pTitle) : it.pTitle);
  const mp = [];
  if (!ONE) mp.push(hasCap ? escH(it.pTitle) : `set ${it.pIdx + 1} / ${D.posts.length}`);
  else if (whenTxt) mp.push(escH(whenTxt));
  mp.push(escH(f.id));
  mp.push(`${i + 1} / ${ALL.length}`);
  lbmeta.innerHTML = mp.join(" &nbsp;&middot;&nbsp; ");

  let h = "";
  if (!ONE && D.posts.length > 1) {
    if (it.pIdx > 0) h += `<button type="button" class="lk sec" data-jump="${POST_START[it.pIdx - 1]}">&larr; ${escH(D.posts[it.pIdx - 1].s || D.posts[it.pIdx - 1].t)}</button>`;
    if (it.pIdx < D.posts.length - 1) h += `<button type="button" class="lk sec" data-jump="${POST_START[it.pIdx + 1]}">${escH(D.posts[it.pIdx + 1].s || D.posts[it.pIdx + 1].t)} &rarr;</button>`;
  }
  if (Array.isArray(f.r)) f.r.forEach(s => {
    const lbl = s.s || s.sub || "Reddit";
    const u = s.url || ("https://www.reddit.com/" + lbl);
    h += `<a class="lk reddit" href="${escH(u)}" target="_blank" rel="noopener">${RICO}${escH(lbl)}</a>`;
  });
  if (f.ig) h += `<a class="lk ig" href="${escH(f.ig)}" target="_blank" rel="noopener">${IGICO}Instagram</a>`;
  lblinks.innerHTML = h;
  lblinks.querySelectorAll("[data-jump]").forEach(b => { b.onclick = e => { e.stopPropagation(); show(+b.dataset.jump); }; });

  lb.classList.remove("lb-side", "lb-below");
  lb.classList.add(sideLayout(curAr) ? "lb-side" : "lb-below");
  if (!lb.open) { lb.showModal(); lb.focus({preventScroll:true}); }
  fitImg();
  if (location.hash.slice(1) !== f.id) setHash("#" + f.id);
}

function step(d){ if (idx < 0) return; show((idx + d + ALL.length) % ALL.length); }
function closeLb(){ if (lb.open) lb.close(); }
lb.addEventListener("close", () => {
  idx = -1; curHi = ""; lbi.src = ""; lbi.style.width = ""; lbi.style.height = "";
  if (location.hash && !location.hash.startsWith("#p-")) setHash(location.pathname + location.search);
  if (!openedByKey && document.activeElement && document.activeElement.tagName === "FIGURE") document.activeElement.blur();
});
addEventListener("resize", () => {
  if (idx >= 0 && lb.open) { lb.classList.remove("lb-side", "lb-below"); lb.classList.add(sideLayout(curAr) ? "lb-side" : "lb-below"); fitImg(); }
});
document.getElementById("lbprev").onclick = e => { e.stopPropagation(); step(-1); };
document.getElementById("lbnext").onclick = e => { e.stopPropagation(); step(1); };
document.getElementById("lbx").onclick = closeLb;
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("stage") || e.target === lbi) closeLb(); });
if (!("closedBy" in HTMLDialogElement.prototype)) {
  let downOut = false;
  const out = e => { const r = lb.getBoundingClientRect(); return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom; };
  lb.addEventListener("pointerdown", e => { downOut = e.target === lb && out(e); });
  lb.addEventListener("pointerup", e => { if (downOut && e.target === lb && out(e)) closeLb(); downOut = false; });
}
addEventListener("keydown", e => {
  if (!lb.open) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});
if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
  addEventListener("pointermove", e => {
    if (!lb.open) return;
    document.documentElement.style.setProperty("--throw-x", e.clientX + "px");
    document.documentElement.style.setProperty("--throw-y", e.clientY + "px");
  }, {passive:true});
}

// Touch: swipe left/right for next/previous (follows finger), swipe down to close
(() => {
  let x0 = null, y0 = 0, dx = 0, dy = 0, t0 = 0, axis = "", busy = false;
  const EASE = "cubic-bezier(.2,.75,.25,1)";
  const reset = () => { lbi.style.transition = `transform .24s ${EASE}, opacity .24s ease`; lbi.style.transform = ""; lbi.style.opacity = ""; };
  lb.addEventListener("touchstart", e => {
    if (busy || !lb.open || e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = dy = 0; axis = ""; t0 = Date.now(); lbi.style.transition = "none";
  }, {passive:true});
  lb.addEventListener("touchmove", e => {
    if (x0===null) return;
    if (e.touches.length !== 1) { x0 = null; reset(); return; }
    dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
    if (!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (axis === "x") { e.preventDefault(); lbi.style.transform = `translate3d(${dx}px,0,0)`; lbi.style.opacity = String(1 - Math.min(.35, Math.abs(dx) / innerWidth * .6)); }
    else if (axis === "y") { e.preventDefault(); const d = Math.max(0, dy); lbi.style.transform = `translate3d(0,${d}px,0) scale(${1 - Math.min(.12, d / innerHeight * .3)})`; lbi.style.opacity = String(1 - Math.min(.6, d / innerHeight)); }
  }, {passive:false});
  lb.addEventListener("touchend", () => {
    if (x0 === null) return; x0 = null;
    const fast = Date.now() - t0 < 280;
    if (axis === "x" && (Math.abs(dx) > innerWidth * .16 || (fast && Math.abs(dx) > 35))) {
      const d = dx < 0 ? 1 : -1; busy = true;
      lbi.style.transition = "transform .15s ease-in, opacity .15s ease-in"; lbi.style.transform = `translate3d(${-d * innerWidth * .55}px,0,0)`; lbi.style.opacity = "0";
      setTimeout(() => { lbi.style.transition = "none"; lbi.style.transform = `translate3d(${d * innerWidth * .3}px,0,0)`; lbi.style.opacity = "0"; step(d);
        requestAnimationFrame(() => requestAnimationFrame(() => { reset(); setTimeout(() => { busy = false; }, 120); })); }, 150);
    } else if (axis === "y" && (dy > innerHeight * .16 || (fast && dy > 50))) { reset(); closeLb(); }
    else reset();
  });
  lb.addEventListener("touchcancel", () => { x0 = null; reset(); });
})();

// Deep-link hash support (#<camera-id> opens lightbox; #p-<section> scrolls to section)
function openHash(){
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) return;
  if (raw === "p-harbor" || raw === "p-streets") { const v = document.getElementById("p-vibes"); if (v) v.scrollIntoView({block:"start"}); return; }
  if (raw === "p-skyline") { const v = document.getElementById("p-towers"); if (v) v.scrollIntoView({block:"start"}); return; }
  if (raw.startsWith("p-")) { const v = document.getElementById(raw); if (v) v.scrollIntoView({block:"start"}); return; }
  const id = raw.replace(/^([A-Za-z]+\d+)[-._].*$/, "$1");
  const k = ALL.findIndex(x => x.f.id === id);
  if (k >= 0) show(k);
}
addEventListener("hashchange", openHash);
addEventListener("load", openHash);

// Equal-area thumbnail packing per L / P strip, uniform height per row, flush to column width
function justify(){
  const G = innerWidth <= 680 ? 6 : 8;
  document.querySelectorAll(".strip").forEach(s => {
    const W = s.clientWidth; if (!W) return;
    const mob = W < 520;
    const nP = mob ? 2 : Math.max(3, Math.round((W + G) / (235 + G)));
    const p = (W - (nP - 1) * G) / nP, A = p * p * 4 / 3;
    const nat = r => Math.sqrt(A * r), rows = [];
    let row = [], used = 0;
    [...s.children].forEach(f => {
      const r = +f.dataset.r || 1, nw = nat(r);
      if (row.length && used + G + nw > W * 1.09) { rows.push(row); row = []; used = 0; }
      used += (row.length ? G : 0) + nw;
      row.push([f, r]);
    });
    if (row.length) rows.push(row);
    const maxS = mob ? 1.65 : 1.3;
    rows.forEach((rw, i) => {
      const avail = W - G * (rw.length - 1);
      const sumR = rw.reduce((a, x) => a + x[1], 0);
      const meanR = sumR / rw.length;
      const hn = Math.sqrt(A / meanR);
      const rawH = avail / sumR;
      const last = i === rows.length - 1;
      const mobWide = mob && rw.length === 1 && rw[0][1] > 1.03;
      const full = mobWide || (!last ? rawH <= hn * maxS : rawH <= hn * 1.14);
      const h = Math.max(40, Math.round(full ? rawH : (last ? hn : hn * maxS)));
      let wSum = 0;
      const ws = rw.map(([f, r]) => { const w = Math.max(40, Math.round(h * r)); wSum += w; return w; });
      if (full && ws.length) ws[ws.length - 1] += avail - wSum;
      const slack = full || last ? 0 : Math.max(0, avail - wSum);
      rw.forEach(([f], j) => {
        f.style.width = ws[j] + "px";
        f.style.height = h + "px";
        f.style.marginRight = (j === rw.length - 1 && slack > 0) ? slack + "px" : "";
      });
    });
  });
  if (!ONE) nav.classList.toggle("is-over", nav.scrollWidth > nav.clientWidth + 2);
}
justify();
let jt; new ResizeObserver(() => { clearTimeout(jt); jt = setTimeout(justify, 60); }).observe(document.body);

(() => { const K = "sadh-photos-theme", de = document.documentElement, m = document.querySelector('meta[name="color-scheme"]'), b = document.getElementById("tbtn");
  const apply = v => { if (v === "light" || v === "dark") { de.dataset.theme = v; if (m) m.content = v; } else { delete de.dataset.theme; if (m) m.content = "light dark"; } };
  if (b) b.onclick = () => { const sys = matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light";
    const cur = de.dataset.theme || sys, next = cur === "dark" ? "light" : "dark";
    apply(next === sys ? null : next); try { next === sys ? localStorage.removeItem(K) : localStorage.setItem(K, next); } catch {} };
  addEventListener("storage", e => { if (e.key === K) apply(e.newValue); }); })();
